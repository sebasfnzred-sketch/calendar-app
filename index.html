<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">

    <header id="cal-header">
      <button id="btn-prev" aria-label="Previous month">&#8249;</button>
      <h1 id="month-label"></h1>
      <button id="btn-next" aria-label="Next month">&#8250;</button>
      <button id="btn-today">Today</button>
    </header>

    <div id="cal-weekdays" role="row" aria-hidden="true">
      <span>Sun</span><span>Mon</span><span>Tue</span>
      <span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
    </div>

    <main id="cal-grid" role="grid" aria-label="Calendar"></main>

  </div>

  <div id="modal-overlay" class="hidden" role="dialog" aria-modal="true"
       aria-labelledby="modal-title">
    <div id="modal">
      <button id="modal-close" aria-label="Close">&times;</button>
      <h2 id="modal-title">Add Event</h2>

      <form id="event-form" novalidate>
        <input type="hidden" id="field-id">

        <div class="form-group">
          <label for="field-title">Title <span aria-hidden="true">*</span></label>
          <input type="text" id="field-title" maxlength="100"
                 placeholder="Event title" autocomplete="off">
          <span class="field-error" id="err-title"></span>
        </div>

        <div class="form-group">
          <label for="field-date">Date <span aria-hidden="true">*</span></label>
          <input type="date" id="field-date">
          <span class="field-error" id="err-date"></span>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="field-start">Start time</label>
            <input type="time" id="field-start">
          </div>
          <div class="form-group">
            <label for="field-end">End time</label>
            <input type="time" id="field-end">
            <span class="field-error" id="err-time"></span>
          </div>
        </div>

        <div class="form-group">
          <label for="field-desc">Description</label>
          <textarea id="field-desc" rows="3" maxlength="500"
                    placeholder="Optional notes"></textarea>
        </div>

        <div class="form-group form-group--color">
          <label for="field-color">Color</label>
          <input type="color" id="field-color" value="#4A90E2">
        </div>

        <div id="modal-actions">
          <button type="submit" id="btn-save">Save</button>
          <button type="button" id="btn-delete" class="hidden btn-danger">Delete</button>
          <button type="button" id="btn-cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
